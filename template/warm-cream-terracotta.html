<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm Cream · Terracotta · Cecilia's Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #faf6f1;
      --surface: #ffffff;
      --text: #3a2b22;
      --muted: #9a8478;
      --accent: #c1734f;
      --line: #ecdfd4;
      --max: 740px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: var(--max);
      margin: 0 auto;
      padding: 48px 24px 36px;
      border-bottom: 1px solid var(--line);
    }
    .logo { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 500; }
    nav { display: flex; gap: 32px; font-size: 15px; color: var(--muted); }
    nav a:hover { color: var(--accent); }
    main { max-width: var(--max); margin: 0 auto; padding: 80px 24px 96px; }
    .hero { margin-bottom: 100px; }
    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    .hero p { color: var(--muted); font-size: 18px; max-width: 480px; }
    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 28px;
    }
    .record-list { display: flex; flex-direction: column; gap: 18px; }
    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 24px 28px;
      transition: border-color .2s, background .2s;
    }
    .record-item:hover { border-color: var(--accent); background: #fdf1ea; }
    .record-title { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 400; }
    .record-date { font-size: 14px; color: var(--muted); white-space: nowrap; margin-left: 24px; }
    footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 36px 24px 64px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }
    @media (max-width: 640px) {
      .hero h1 { font-size: 36px; }
      .record-item { flex-direction: column; align-items: flex-start; gap: 6px; }
      .record-date { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">Cecilia's Home</a>
    <nav>
      <a href="#">记录</a>
      <a href="#">相册</a>
      <a href="#">音乐</a>
      <a href="#">关于</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>Hi，我是 Cecilia</h1>
      <p>前端 / 全栈开发者。这里是我做过的东西，以及一些随手的记录。</p>
    </section>
    <section>
      <div class="section-title">Daily Log</div>
      <div class="record-list">
        <a class="record-item" href="#">
          <span class="record-title">从零复现 BERT</span>
          <span class="record-date">2026-08-02</span>
        </a>
        <a class="record-item" href="#">
          <span class="record-title">用 Vite 搭建个人主页</span>
          <span class="record-date">2026-07-15</span>
        </a>
        <a class="record-item" href="#">
          <span class="record-title">音乐播放器组件设计</span>
          <span class="record-date">2026-06-28</span>
        </a>
        <a class="record-item" href="#">
          <span class="record-title">相册懒加载与瀑布流</span>
          <span class="record-date">2026-06-10</span>
        </a>
      </div>
    </section>
  </main>
  <footer>© 2026 Cecilia</footer>
</body>
</html>
